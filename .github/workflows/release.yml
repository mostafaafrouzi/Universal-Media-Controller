name: Create Release

on:
  push:
    tags:
      - 'v*' # Triggers ONLY on version tags like v0.3.0

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Validate version match
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: manifest.json version ($MANIFEST_VERSION) doesn't match tag version ($TAG_VERSION)"
            exit 1
          fi
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) doesn't match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Version validation passed: $MANIFEST_VERSION"

      - name: Create releases directory
        run: mkdir -p releases

      - name: Build extension (create zip)
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "releases/universal-media-controller.zip" ]; then
            echo "Error: Build output not found"
            exit 1
          fi
          echo "✅ Build successful"

          if ! unzip -l releases/universal-media-controller.zip | grep -q "manifest.json"; then
            echo "Error: manifest.json not found in zip root"
            exit 1
          fi
          echo "✅ Zip structure validated"

      - name: Rename zip file with version
        run: |
          mv releases/universal-media-controller.zip \
             releases/universal-media-controller-${{ steps.get_version.outputs.TAG }}.zip

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Extract from "## [VERSION]" until the next "## [" header (exclusive).
          # Important: skip the end-pattern check on the starting line, otherwise
          # awk range /start/,/## [/ collapses to a single empty section.
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { printing = 1; print; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "Error: No changelog section found for version $VERSION in CHANGELOG.md"
            exit 1
          fi

          echo "✅ Changelog extracted:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/universal-media-controller-${{ steps.get_version.outputs.TAG }}.zip
          name: Universal Media Controller ${{ steps.get_version.outputs.TAG }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.get_version.outputs.TAG }}
          path: releases/universal-media-controller-${{ steps.get_version.outputs.TAG }}.zip
          retention-days: 90
